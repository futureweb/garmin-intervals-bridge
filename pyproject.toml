[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-intervals-bridge"
version = "0.3.1"
description = "Self-hosted Garmin Connect original FIT and wellness sync to Intervals.icu"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Andreas Schnederle-Wagner"}]
keywords = ["garmin", "garmin-connect", "intervals.icu", "fit", "wellness", "sync", "cycling", "running"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = ["garminconnect>=0.3.17,<0.4", "requests>=2.31,<3", "garmin-fit-sdk>=21.171"]

[project.urls]
Homepage = "https://github.com/futureweb/garmin-intervals-bridge"
Repository = "https://github.com/futureweb/garmin-intervals-bridge"
Issues = "https://github.com/futureweb/garmin-intervals-bridge/issues"
Changelog = "https://github.com/futureweb/garmin-intervals-bridge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6", "pip-audit>=2.7"]

[project.scripts]
garmin-intervals-bridge = "garmin_intervals_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]   # fixture literals quoting custom-item scripts are long on purpose

name: Garmin Intervals Bridge
version: "0.12.3"
slug: garmin_intervals_bridge
description: Your complete Garmin data in Intervals.icu – or a backup of it, kept in Home Assistant
url: https://github.com/futureweb/garmin-intervals-bridge
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:bridge
panel_title: Garmin Bridge
backup: hot
timeout: 30
map:
  - share
options:
  garmin_source: auto
  garmin_personal_api_key: ""
  intervals_api_key: ""
  mode: enrich
  write_to_intervals: false
  swap: false
  imready4: false
  hrvtrend: false
  intervals_notes: true
  update_check: false
schema:
  garmin_source: list(auto|direct|personal|hybrid)
  garmin_personal_api_key: password?
  garmin_personal_api_key_expires: match(^\d{4}-\d{2}-\d{2}$)?
  intervals_api_key: password?
  mode: list(enrich|upload|backup)
  write_to_intervals: bool
  swap: bool
  swap_method: list(replace|upload)?
  imready4: bool
  hrvtrend: bool
  intervals_notes: bool
  update_check: bool
  timezone: str?
  poll_hours: str?
  poll_seconds: int(30,3600)?
  poll_quiet_seconds: int(60,86400)?
  poll_mode: list(fixed|adaptive)?
  backup_hours: int(1,168)?
  alert_email: email?
  smtp_password: password?
  ntfy_url: url?

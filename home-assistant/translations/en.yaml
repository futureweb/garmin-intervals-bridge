configuration:
  garmin_source:
    name: Garmin source
    description: Auto (default) selects direct without a key, Personal with a key, hybrid with both key and saved session.
  garmin_personal_api_key:
    name: Garmin Personal API key
    description: Required for personal and hybrid. Create it in Garmin Connect; replace it before it expires.
  garmin_personal_api_key_expires:
    name: Personal key expiry date
    description: Optional YYYY-MM-DD from Garmin Connect. Reminders at 14 and 3 days before expiry.
  intervals_api_key:
    name: Intervals.icu API key
    description: Intervals.icu → Settings → Developer Settings → API key. Not needed in backup mode.
  mode:
    name: Mode
    description: >-
      enrich – Garmin's official import stays on, the bridge adds what Garmin filters out (usual);
      upload – the official activity import is off, the bridge uploads every original;
      backup – no Intervals: your Garmin data is kept in this app's data folder.
  write_to_intervals:
    name: Write to Intervals
    description: Off = a dry run that only logs what it would do. Switch on once the log looks right.
  swap:
    name: Swap Garmin's copy for the original
    description: >-
      Puts your original file in place of the filtered copy Garmin's import created in Intervals. "Reprocess
      file" then keeps everything; nothing on Garmin Connect is touched.
  swap_method:
    name: How to swap
    description: >-
      replace (default) – the original goes into the same activity: id, notes, comments and edited intervals
      stay, nothing is deleted. upload – the original as a new activity of your own; Garmin's copy is deleted
      (never one with comments or edited intervals).
  imready4:
    name: ImReady4 training advice
    description: Fill the TrainingAdvice wellness field each morning, as ImReady4's script does.
  hrvtrend:
    name: HRV trend advice (experimental)
    description: A calmer advice from the 7-day HRV trend, in its own field.
  intervals_notes:
    name: Calendar note when Garmin needs a sign-in
    description: One note in your Intervals calendar when Garmin's session has ended.
  update_check:
    name: Update hint in the log
    description: Home Assistant shows app updates itself; this only adds a log line.
  timezone:
    name: Time zone
    description: Empty = Home Assistant's. Region/City, e.g. Europe/London.
  poll_hours:
    name: Poll hours
    description: Look for new activities only then, e.g. 6-22 (empty = always); outside them not at all, or at the quiet interval.
  poll_seconds:
    name: Poll interval
    description: Seconds between the checks for new activities (default 300) – the fastest pace, adaptive or not.
  poll_quiet_seconds:
    name: Quiet interval
    description: >-
      Outside the poll hours check this often instead of not at all, and at unusual times in the adaptive
      mode (there 1800 by default). For an hour after a new activity: the poll interval again.
  poll_mode:
    name: Adaptive polling (beta)
    description: >-
      adaptive – learn from the archive when your activities usually end and check at the poll interval only
      then, less often otherwise: fewer requests for Intervals.icu. fixed – always the poll interval.
  backup_hours:
    name: Backup interval
    description: Backup mode – hours between runs (default 12).
  alert_email:
    name: Alert e-mail
    description: An e-mail when the bridge needs you, sent from this mailbox to itself.
  smtp_password:
    name: Alert e-mail password
    description: Password to send from that mailbox (Gmail, iCloud, Yahoo – an app password).
  ntfy_url:
    name: Push messages (ntfy)
    description: https://ntfy.sh/a-long-name-only-you-know – the free ntfy app shows a message when the bridge needs you.

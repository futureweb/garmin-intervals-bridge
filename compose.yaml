services:
  bridge:
    build: .
    init: true
    env_file: .env
    environment:
      BRIDGE_DATA_DIR: /data
      GARMIN_TOKEN_DIR: /data/tokens
    volumes:
      - ./data:/data
    # Runs as UID 10001 (see Dockerfile); the data directory must be writable by it.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    # Not an always-on daemon: schedule `docker compose run --rm -T bridge watch --apply`
    # (every minute) and `... sync --apply` (every 30 minutes) from cron or a timer.
    command: ["sync"]

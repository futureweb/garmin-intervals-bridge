<!-- Garmin Intervals Bridge: sister of the Futureweb Intervals MCP icon (same colours, bars and endpoints).
     The MCP's line runs under rising bars; here it is a bridge deck between two endpoints,
     carried by the same bars turned into piers. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#FFFFFF"/>
  <g transform="translate(0 -24)">
  <g fill="#F57A0A">
    <!-- the piers: the MCP's bars turned upside down, deepest over the middle of the valley -->
    <path d="M120 211 V292 a24 24 0 0 0 24 24 h32 a24 24 0 0 0 24 -24 V211 z"/>
    <path d="M216 194 V392 a24 24 0 0 0 24 24 h32 a24 24 0 0 0 24 -24 V194 z"/>
    <path d="M312 211 V292 a24 24 0 0 0 24 24 h32 a24 24 0 0 0 24 -24 V211 z"/>
  </g>
  <!-- the deck: one line from endpoint to endpoint, carrying the data across -->
  <path d="M76 196 Q256 128 436 196" fill="none" stroke="#0B2550" stroke-width="30" stroke-linecap="round"/>
  <circle cx="76" cy="196" r="38" fill="#0B2550"/>
  <circle cx="436" cy="196" r="38" fill="#0B2550"/>
  </g>
</svg>
